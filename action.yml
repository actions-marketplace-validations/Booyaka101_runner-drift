name: 'runner-drift'
# NOTE: the GitHub Marketplace rejects a description of 125 characters or more.
description: 'Lock the tool versions your CI uses, diff them on every runner-image bump, and name the commit that changed them.'
author: 'Booyaka101'

branding:
  icon: 'activity'
  color: 'orange'

inputs:
  mode:
    description: 'Which check to run: guard (runner-image tool drift), actions (which uses: references stop working when Node 20 leaves the runners), or runners (self-hosted agent versions).'
    required: false
    default: 'guard'
  fail-on:
    description: 'Fail the job on drift of at least this severity: major, minor or any. Omit to never fail (report only).'
    required: false
    default: ''
  fail-on-retirement:
    description: 'Fail if a pinned runs-on label browns out or retires within this many days. Empty disables the check.'
    required: false
    default: ''
  fail-on-deprecation:
    description: 'Fail if this self-hosted runner version loses support within this many days. Needs a token with administration read; empty disables.'
    required: false
    default: ''
  tools:
    description: 'Comma-separated tools to watch (e.g. python,cmake,clang). Omit to use the lock file, then workflow detection.'
    required: false
    default: ''
  lock-file:
    description: 'Path to runner-lock.json.'
    required: false
    default: 'runner-lock.json'
  workflows:
    description: 'Workflow directory scanned when there is no lock file yet.'
    required: false
    default: '.github/workflows'
  version:
    description: 'npm version of runner-drift to run.'
    required: false
    default: '1.3.0'
  package:
    description: 'Override the npm spec, e.g. a local .tgz built in the same job. Mainly for testing this action before the version it requests exists on npm.'
    required: false
    default: ''
  warn-only:
    description: 'For mode: actions - report what will break but never fail the job.'
    required: false
    default: 'false'
  fail-on-unknown:
    description: 'For mode: actions - also fail when a uses: cannot be resolved to a runtime (404, private repo, rate limit, expression).'
    required: false
    default: 'false'
  github-token:
    description: 'Raises the api.github.com rate limit. For fail-on-deprecation it must also carry administration read, which the default token does not.'
    required: false
    default: ${{ github.token }}

outputs:
  lock-file:
    description: 'Path to the lock file that was read/written (mode: guard).'
    value: ${{ steps.drift.outputs.lock-file }}
  will-fail-count:
    description: 'How many action references stop working when Node 20 is removed (mode: actions).'
    value: ${{ steps.drift.outputs.will-fail-count }}

runs:
  using: 'composite'
  steps:
    - id: drift
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        RD_MODE: ${{ inputs.mode }}
        RD_WARN_ONLY: ${{ inputs.warn-only }}
        RD_FAIL_ON_UNKNOWN: ${{ inputs.fail-on-unknown }}
        RD_FAIL_ON: ${{ inputs.fail-on }}
        RD_FAIL_ON_RETIREMENT: ${{ inputs.fail-on-retirement }}
        RD_FAIL_ON_DEPRECATION: ${{ inputs.fail-on-deprecation }}
        RD_TOOLS: ${{ inputs.tools }}
        RD_LOCK_FILE: ${{ inputs.lock-file }}
        RD_WORKFLOWS: ${{ inputs.workflows }}
        RD_VERSION: ${{ inputs.version }}
        RD_PACKAGE: ${{ inputs.package }}
      run: |
        set -euo pipefail
        # Absolute paths, because npx runs from a neutral directory below.
        cd "$GITHUB_WORKSPACE"
        # `shell: bash` on windows-latest is Git Bash, where an absolute path may
        # well arrive as D:\a\_temp — treat a drive prefix as absolute too, or it
        # gets $PWD glued onto the front of it.
        abs() { case "$1" in /* | [A-Za-z]:[/\\]*) printf '%s' "$1";; *) printf '%s/%s' "$PWD" "$1";; esac; }
        LOCK_ABS="$(abs "$RD_LOCK_FILE")"
        WF_ABS="$(abs "$RD_WORKFLOWS")"
        case "$RD_MODE" in
          guard)
            args=(guard --lock-file "$LOCK_ABS" --workflows "$WF_ABS")
            if [ -n "$RD_FAIL_ON" ]; then args+=(--fail-on "$RD_FAIL_ON"); fi
            if [ -n "$RD_FAIL_ON_RETIREMENT" ]; then args+=(--fail-on-retirement "$RD_FAIL_ON_RETIREMENT"); fi
            if [ -n "$RD_FAIL_ON_DEPRECATION" ]; then args+=(--fail-on-deprecation "$RD_FAIL_ON_DEPRECATION"); fi
            if [ -n "$RD_TOOLS" ]; then args+=(--tools "$RD_TOOLS"); fi
            printf 'lock-file=%s\n' "$RD_LOCK_FILE" >> "$GITHUB_OUTPUT"
            ;;
          actions)
            args=(actions "$GITHUB_WORKSPACE" --workflows "$WF_ABS")
            if [ "$RD_WARN_ONLY" = 'true' ]; then args+=(--warn-only); fi
            if [ "$RD_FAIL_ON_UNKNOWN" = 'true' ]; then args+=(--fail-on-unknown); fi
            ;;
          runners)
            args=(runners --workflows "$WF_ABS")
            if [ -n "$RD_FAIL_ON_DEPRECATION" ]; then args+=(--fail-on-deprecation "$RD_FAIL_ON_DEPRECATION"); fi
            ;;
          *)
            printf 'runner-drift: unknown mode "%s" - use guard, actions or runners\n' "$RD_MODE" >&2
            exit 2
            ;;
        esac
        # npx resolves a bin against the CWD's package.json first. In a checkout
        # whose package.json is itself named runner-drift at the same version --
        # i.e. this repo -- it decides the package is already present, looks for
        # node_modules/.bin/runner-drift, and dies with "runner-drift: not found"
        # (exit 127) before any install has run. Invoking from an empty directory
        # removes the ambiguity; --package= does NOT, it is the CWD that matters.
        RD_TMP="$(mktemp -d)"
        SPEC="runner-drift@${RD_VERSION}"
        case "${RD_PACKAGE:-}" in
          '') ;;
          *.tgz|*.tar.gz)
            # npx silently no-ops on an ABSOLUTE .tgz path -- exit 0, nothing
            # installed, no error to grep for. Copy it in and use a relative
            # spec, and give the scratch dir its own package.json.
            cp "$(abs "$RD_PACKAGE")" "$RD_TMP/local-package.tgz"
            printf '{"name":"rd-action-scratch","version":"0.0.0","private":true}\n' > "$RD_TMP/package.json"
            SPEC='./local-package.tgz'
            ;;
          *) SPEC="$RD_PACKAGE" ;;
        esac
        ( cd "$RD_TMP" && npx --yes "$SPEC" "${args[@]}" )
