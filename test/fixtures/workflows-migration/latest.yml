name: ci
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: cmake --version
      - run: python --version

  pinned:
    runs-on: ubuntu-24.04
    steps:
      - run: node --version

  lint:
    runs-on: ubuntu-22.04
    steps:
      - run: echo lint
