      - uses: acme/pinned@8f4b7f8452b1a2ee3bd35a08f1a1a62c76c8a2fa # v1.2.3
      - name: no action here
        run: echo "using: node20 is a red herring"

  call:
    uses: acme/flows/.github/workflows/release.yml@v3
